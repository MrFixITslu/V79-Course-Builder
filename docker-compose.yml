version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: v79_academy_postgres
    environment:
      POSTGRES_USER: v79_admin
      POSTGRES_PASSWORD: v79_secure_password
      POSTGRES_DB: v79_academy_builder
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - v79_internal
    restart: always

  course-builder:
    build: .
    container_name: v79_course_builder
    expose:
      - "3030"
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - ACADEMY_PUBLIC_URL=${ACADEMY_PUBLIC_URL:-}
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - ADMIN_RESET_TOKEN=${ADMIN_RESET_TOKEN:-}
      - DATABASE_URL=postgresql://v79_admin:v79_secure_password@postgres:5432/v79_academy_builder
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - V79_PLATFORM_SHARED_SECRET=${V79_PLATFORM_SHARED_SECRET:-}
      - V79_HUB_EVENT_URL=${V79_HUB_EVENT_URL:-http://v79-hub:3040/api/platform/events}
      - V79_HUB_EVENT_SECRET=${V79_HUB_EVENT_SECRET:-}
      - WEBSITE_SYNC_URL=${WEBSITE_SYNC_URL}
      - WEBSITE_ADMIN_PASSWORD=${WEBSITE_ADMIN_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3030/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      - postgres
    networks:
      - v79_internal
      - proxy_network
    restart: always

  nginx-proxy:
    image: nginx:alpine
    container_name: v79_nginx_proxy

    # Host port 8095 is the single entry point used by Nginx Proxy Manager
    # for Gaming Studio J. Internally this container still listens on port 80.
    ports:
      - "8095:80"
    expose:
      - "80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - course-builder
    networks:
      - v79_internal
      - proxy_network
    restart: always

networks:
  v79_internal:
    driver: bridge
  proxy_network:
    external: true

volumes:
  postgres_data:
