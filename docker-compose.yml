services:
  postgres:
    image: postgres:15-alpine
    container_name: v79_academy_postgres
    environment:
      POSTGRES_USER: v79_admin
      POSTGRES_PASSWORD: v79_secure_password
      POSTGRES_DB: v79_academy_builder
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - v79_internal
    restart: always

  course-builder:
    build: .
    container_name: v79_course_builder
    expose:
      - "3030"
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - DATABASE_URL=postgresql://v79_admin:v79_secure_password@postgres:5432/v79_academy_builder
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Required to publish courses to the website (website2026 / VISION79
      # marketplace admin API). WEBSITE_ADMIN_PASSWORD must match that site's
      # current admin password - if that site is showing its forced
      # one-time-password screen, log in there and set a permanent password
      # first, then put that same password here.
      - WEBSITE_SYNC_URL=${WEBSITE_SYNC_URL}
      - WEBSITE_ADMIN_PASSWORD=${WEBSITE_ADMIN_PASSWORD}
      # OPTIONAL: seeds the very first one-time admin password on first boot
      # only (see server.ts comments). If unset, one is generated randomly
      # and printed once to `docker logs v79_course_builder`.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      # Without this, course data AND the admin login credential are stored
      # only inside the container's filesystem and are wiped on every
      # rebuild/restart - this mount makes both persist.
      - ./data:/app/data
    depends_on:
      - postgres
    networks:
      - v79_internal
      - proxy_network
    restart: always

  nginx-proxy:
    image: nginx:alpine
    container_name: v79_nginx_proxy
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - course-builder
    networks:
      - v79_internal
      - proxy_network
    restart: always

networks:
  v79_internal:
    driver: bridge
  proxy_network:
    external: true

volumes:
  postgres_data:


