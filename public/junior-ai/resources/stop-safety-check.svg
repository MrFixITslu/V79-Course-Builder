<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#f8fafc"/>
<rect width="1200" height="180" fill="#0f766e"/>
<text x="70" y="78" font-family="Arial" font-size="50" font-weight="900" fill="#fff">STOP Before You Prompt</text>
<text x="70" y="128" font-family="Arial" font-size="24" font-weight="600" fill="#fff">Protect private information and ask an adult when you are unsure.</text>
<rect x="70" y="245" width="1060" height="174" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="105" y="293" font-family="Arial" font-size="30" font-weight="800" fill="#0f766e">S — Secrets: Is there anything private here?</text>
<line x1="105" y1="333" x2="1090" y2="333" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="377" x2="1090" y2="377" stroke="#cbd5e1" stroke-width="2"/><rect x="70" y="447" width="1060" height="174" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="105" y="495" font-family="Arial" font-size="30" font-weight="800" fill="#0f766e">T — Telephone / address: Am I sharing contact or location details?</text>
<line x1="105" y1="535" x2="1090" y2="535" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="579" x2="1090" y2="579" stroke="#cbd5e1" stroke-width="2"/><rect x="70" y="649" width="1060" height="174" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="105" y="697" font-family="Arial" font-size="30" font-weight="800" fill="#0f766e">O — Online passwords: Never paste passwords or login codes.</text>
<line x1="105" y1="737" x2="1090" y2="737" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="781" x2="1090" y2="781" stroke="#cbd5e1" stroke-width="2"/><rect x="70" y="851" width="1060" height="174" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="105" y="899" font-family="Arial" font-size="30" font-weight="800" fill="#0f766e">P — Personal information: Do I really need to share this?</text>
<line x1="105" y1="939" x2="1090" y2="939" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="983" x2="1090" y2="983" stroke="#cbd5e1" stroke-width="2"/><rect x="70" y="1053" width="1060" height="218" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="105" y="1101" font-family="Arial" font-size="30" font-weight="800" fill="#0f766e">Permission check — Am I using another person's face, voice or work?</text>
<line x1="105" y1="1141" x2="1090" y2="1141" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="1185" x2="1090" y2="1185" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="1229" x2="1090" y2="1229" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="1545" font-family="Arial" font-size="22" font-weight="700" fill="#64748b">V79 Junior AI Academy • Print or complete with your instructor</text>
</svg>