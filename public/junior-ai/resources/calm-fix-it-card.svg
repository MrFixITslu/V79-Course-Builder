<text x="70" y="78" font-family="Arial" font-size="50" font-weight="900" fill="#fff">CALM Fix-It Card</text>
<text x="70" y="128" font-family="Arial" font-size="24" font-weight="600" fill="#fff">For normal disagreements. Tell an adult immediately about unsafe or serious behaviour.</text>
<rect x="70" y="245" width="1060" height="174" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="105" y="293" font-family="Arial" font-size="30" font-weight="800" fill="#6d28d9">C — COOL DOWN: What helped us stop the argument?</text>
<line x1="105" y1="333" x2="1090" y2="333" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="377" x2="1090" y2="377" stroke="#cbd5e1" stroke-width="2"/><rect x="70" y="447" width="1060" height="218" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="105" y="495" font-family="Arial" font-size="30" font-weight="800" fill="#6d28d9">A — ASK &amp; LISTEN: What did each person say?</text>
<line x1="105" y1="535" x2="1090" y2="535" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="579" x2="1090" y2="579" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="623" x2="1090" y2="623" stroke="#cbd5e1" stroke-width="2"/><rect x="70" y="693" width="1060" height="218" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="105" y="741" font-family="Arial" font-size="30" font-weight="800" fill="#6d28d9">L — LOOK FOR FAIR CHOICES: What options did we find?</text>
<line x1="105" y1="781" x2="1090" y2="781" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="825" x2="1090" y2="825" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="869" x2="1090" y2="869" stroke="#cbd5e1" stroke-width="2"/><rect x="70" y="939" width="1060" height="174" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="105" y="987" font-family="Arial" font-size="30" font-weight="800" fill="#6d28d9">M — MAKE AN AGREEMENT: What will we do now?</text>
<line x1="105" y1="1027" x2="1090" y2="1027" stroke="#cbd5e1" stroke-width="2"/><line x1="105" y1="1071" x2="1090" y2="1071" stroke="#cbd5e1" stroke-width="2"/><rect x="70" y="1141" width="1060" height="174" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="105" y="1189" font-family="Arial" font-size="30" font-weight="800" fill="#6d28d9">Next time, what will we do better?</text>
