<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><defs><linearGradient id="g"><stop stop-color="#0369a1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="240" fill="url(#g)"/><text x="80" y="100" font-family="Arial" font-size="56" font-weight="900" fill="#fff">CALM Team Method</text><text x="80" y="164" font-family="Arial" font-size="28" font-weight="600" fill="#fff">Disagree without attacking each other.</text><rect x="80" y="310" width="1040" height="150" rx="28" fill="#fff"/><circle cx="155" cy="385" r="46" fill="#8b5cf6"/><text x="155" y="400" text-anchor="middle" font-family="Arial" font-size="42" font-weight="900" fill="#fff">1</text><foreignObject x="230" y="338" width="820" height="95"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#172033;font-size:32px;font-weight:800;line-height:1.15">COOL DOWN — Stop the argument and lower voices.</div></foreignObject><rect x="80" y="515" width="1040" height="150" rx="28" fill="#fff"/><circle cx="155" cy="590" r="46" fill="#0369a1"/><text x="155" y="605" text-anchor="middle" font-family="Arial" font-size="42" font-weight="900" fill="#fff">2</text><foreignObject x="230" y="543" width="820" height="95"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#172033;font-size:32px;font-weight:800;line-height:1.15">ASK &amp; LISTEN — Everyone gets a turn.</div></foreignObject><rect x="80" y="720" width="1040" height="150" rx="28" fill="#fff"/><circle cx="155" cy="795" r="46" fill="#8b5cf6"/><text x="155" y="810" text-anchor="middle" font-family="Arial" font-size="42" font-weight="900" fill="#fff">3</text><foreignObject x="230" y="748" width="820" height="95"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#172033;font-size:32px;font-weight:800;line-height:1.15">LOOK FOR FAIR CHOICES — Find at least two options.</div></foreignObject><rect x="80" y="925" width="1040" height="150" rx="28" fill="#fff"/><circle cx="155" cy="1000" r="46" fill="#0369a1"/><text x="155" y="1015" text-anchor="middle" font-family="Arial" font-size="42" font-weight="900" fill="#fff">4</text><foreignObject x="230" y="953" width="820" height="95"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#172033;font-size:32px;font-weight:800;line-height:1.15">MAKE AN AGREEMENT — Decide what happens next.</div></foreignObject><text x="80" y="1540" font-family="Arial" font-size="24" font-weight="700" fill="#64748b">V79 Junior AI Academy</text></svg>