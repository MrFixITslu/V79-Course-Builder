<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="170" fill="#312e81"/><text x="70" y="75" font-family="Arial" font-size="56" font-weight="900" fill="#fff">OSI Model — 7 Layers</text><text x="70" y="123" font-family="Arial" font-size="25" font-weight="600" fill="#e0e7ff">Use the layers to understand and troubleshoot packet movement.</text>
<rect x="90" y="235" width="1020" height="145" rx="28" fill="#fff" stroke="#7c3aed" stroke-width="4"/><circle cx="170" cy="307" r="48" fill="#7c3aed"/><text x="170" y="324" text-anchor="middle" font-family="Arial" font-size="44" font-weight="900" fill="#fff">7</text><text x="250" y="297" font-family="Arial" font-size="34" font-weight="900" fill="#0f172a">Application</text><text x="250" y="338" font-family="Arial" font-size="23" font-weight="600" fill="#475569">DNS • HTTP/HTTPS • user-facing services</text><rect x="90" y="415" width="1020" height="145" rx="28" fill="#fff" stroke="#8b5cf6" stroke-width="4"/><circle cx="170" cy="487" r="48" fill="#8b5cf6"/><text x="170" y="504" text-anchor="middle" font-family="Arial" font-size="44" font-weight="900" fill="#fff">6</text><text x="250" y="477" font-family="Arial" font-size="34" font-weight="900" fill="#0f172a">Presentation</text><text x="250" y="518" font-family="Arial" font-size="23" font-weight="600" fill="#475569">Formatting • encryption concepts</text><rect x="90" y="595" width="1020" height="145" rx="28" fill="#fff" stroke="#6366f1" stroke-width="4"/><circle cx="170" cy="667" r="48" fill="#6366f1"/><text x="170" y="684" text-anchor="middle" font-family="Arial" font-size="44" font-weight="900" fill="#fff">5</text><text x="250" y="657" font-family="Arial" font-size="34" font-weight="900" fill="#0f172a">Session</text><text x="250" y="698" font-family="Arial" font-size="23" font-weight="600" fill="#475569">Session/dialog management concept</text><rect x="90" y="775" width="1020" height="145" rx="28" fill="#fff" stroke="#2563eb" stroke-width="4"/><circle cx="170" cy="847" r="48" fill="#2563eb"/><text x="170" y="864" text-anchor="middle" font-family="Arial" font-size="44" font-weight="900" fill="#fff">4</text><text x="250" y="837" font-family="Arial" font-size="34" font-weight="900" fill="#0f172a">Transport</text><text x="250" y="878" font-family="Arial" font-size="23" font-weight="600" fill="#475569">TCP • UDP • ports</text><rect x="90" y="955" width="1020" height="145" rx="28" fill="#fff" stroke="#0284c7" stroke-width="4"/><circle cx="170" cy="1027" r="48" fill="#0284c7"/><text x="170" y="1044" text-anchor="middle" font-family="Arial" font-size="44" font-weight="900" fill="#fff">3</text><text x="250" y="1017" font-family="Arial" font-size="34" font-weight="900" fill="#0f172a">Network</text><text x="250" y="1058" font-family="Arial" font-size="23" font-weight="600" fill="#475569">IP addresses • routing • ICMP</text><rect x="90" y="1135" width="1020" height="145" rx="28" fill="#fff" stroke="#0d9488" stroke-width="4"/><circle cx="170" cy="1207" r="48" fill="#0d9488"/><text x="170" y="1224" text-anchor="middle" font-family="Arial" font-size="44" font-weight="900" fill="#fff">2</text><text x="250" y="1197" font-family="Arial" font-size="34" font-weight="900" fill="#0f172a">Data Link</text><text x="250" y="1238" font-family="Arial" font-size="23" font-weight="600" fill="#475569">Ethernet frames • MAC • VLANs</text><rect x="90" y="1315" width="1020" height="145" rx="28" fill="#fff" stroke="#16a34a" stroke-width="4"/><circle cx="170" cy="1387" r="48" fill="#16a34a"/><text x="170" y="1404" text-anchor="middle" font-family="Arial" font-size="44" font-weight="900" fill="#fff">1</text><text x="250" y="1377" font-family="Arial" font-size="34" font-weight="900" fill="#0f172a">Physical</text><text x="250" y="1418" font-family="Arial" font-size="23" font-weight="600" fill="#475569">Copper • fiber • radio • signals</text>
<text x="90" y="1530" font-family="Arial" font-size="22" font-weight="700" fill="#64748b">Troubleshoot from evidence: physical link → local switching → IP path → service/application.</text></svg>