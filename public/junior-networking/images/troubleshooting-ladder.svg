<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="170" fill="#9a3412"/><text x="70" y="74" font-family="Arial" font-size="54" font-weight="900" fill="#fff">Troubleshooting Ladder</text><text x="70" y="122" font-family="Arial" font-size="25" font-weight="600" fill="#ffedd5">Evidence before guesses • One change at a time • Verify the fix</text>
<rect x="85" y="225" width="1030" height="120" rx="24" fill="#fff" stroke="#fb923c" stroke-width="3"/><circle cx="150" cy="285" r="42" fill="#ea580c"/><text x="150" y="300" text-anchor="middle" font-family="Arial" font-size="38" font-weight="900" fill="#fff">1</text><text x="225" y="274" font-family="Arial" font-size="29" font-weight="900" fill="#7c2d12">DEFINE</text><text x="225" y="309" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Who is affected? What works? What does not work?</text><rect x="85" y="380" width="1030" height="120" rx="24" fill="#fff" stroke="#fb923c" stroke-width="3"/><circle cx="150" cy="440" r="42" fill="#ea580c"/><text x="150" y="455" text-anchor="middle" font-family="Arial" font-size="38" font-weight="900" fill="#fff">2</text><text x="225" y="429" font-family="Arial" font-size="29" font-weight="900" fill="#7c2d12">PHYSICAL</text><text x="225" y="464" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Power • link light • cable • port • NIC</text><rect x="85" y="535" width="1030" height="120" rx="24" fill="#fff" stroke="#fb923c" stroke-width="3"/><circle cx="150" cy="595" r="42" fill="#ea580c"/><text x="150" y="610" text-anchor="middle" font-family="Arial" font-size="38" font-weight="900" fill="#fff">3</text><text x="225" y="584" font-family="Arial" font-size="29" font-weight="900" fill="#7c2d12">LOCAL NETWORK</text><text x="225" y="619" font-family="Arial" font-size="21" font-weight="600" fill="#475569">VLAN • switch port • MAC learning</text><rect x="85" y="690" width="1030" height="120" rx="24" fill="#fff" stroke="#fb923c" stroke-width="3"/><circle cx="150" cy="750" r="42" fill="#ea580c"/><text x="150" y="765" text-anchor="middle" font-family="Arial" font-size="38" font-weight="900" fill="#fff">4</text><text x="225" y="739" font-family="Arial" font-size="29" font-weight="900" fill="#7c2d12">IP CONFIG</text><text x="225" y="774" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Address • prefix/mask • gateway • DHCP</text><rect x="85" y="845" width="1030" height="120" rx="24" fill="#fff" stroke="#fb923c" stroke-width="3"/><circle cx="150" cy="905" r="42" fill="#ea580c"/><text x="150" y="920" text-anchor="middle" font-family="Arial" font-size="38" font-weight="900" fill="#fff">5</text><text x="225" y="894" font-family="Arial" font-size="29" font-weight="900" fill="#7c2d12">PATH</text><text x="225" y="929" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Ping • routing • traceroute • firewall</text><rect x="85" y="1000" width="1030" height="120" rx="24" fill="#fff" stroke="#fb923c" stroke-width="3"/><circle cx="150" cy="1060" r="42" fill="#ea580c"/><text x="150" y="1075" text-anchor="middle" font-family="Arial" font-size="38" font-weight="900" fill="#fff">6</text><text x="225" y="1049" font-family="Arial" font-size="29" font-weight="900" fill="#7c2d12">NAME / SERVICE</text><text x="225" y="1084" font-family="Arial" font-size="21" font-weight="600" fill="#475569">DNS • server/app status • ports</text><rect x="85" y="1155" width="1030" height="120" rx="24" fill="#fff" stroke="#fb923c" stroke-width="3"/><circle cx="150" cy="1215" r="42" fill="#ea580c"/><text x="150" y="1230" text-anchor="middle" font-family="Arial" font-size="38" font-weight="900" fill="#fff">7</text><text x="225" y="1204" font-family="Arial" font-size="29" font-weight="900" fill="#7c2d12">FIX + VERIFY</text><text x="225" y="1239" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Make one controlled change and retest</text><rect x="85" y="1310" width="1030" height="120" rx="24" fill="#fff" stroke="#fb923c" stroke-width="3"/><circle cx="150" cy="1370" r="42" fill="#ea580c"/><text x="150" y="1385" text-anchor="middle" font-family="Arial" font-size="38" font-weight="900" fill="#fff">8</text><text x="225" y="1359" font-family="Arial" font-size="29" font-weight="900" fill="#7c2d12">DOCUMENT</text><text x="225" y="1394" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Root cause • evidence • prevention • diagram/update</text>
